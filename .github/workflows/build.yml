name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK уже предустановлен на ubuntu-latest (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # Журнал ошибки — в задачу (Issues), чтобы его можно было прочитать через API
      - name: Сообщить об ошибке сборки
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -150; echo; tail -60 build.log; echo '```'; } > err.md
          gh issue create --title "Сборка ${{ github.run_number }} не удалась" --body-file err.md || true

      - name: Сохранить журнал сборки
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v5
        with:
          name: VideoSzhatie-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Публикуем APK на странице Releases — оттуда его удобно скачать прямо на телефон
      - name: Опубликовать APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VideoSzhatie.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" VideoSzhatie.apk \
            --title "Сжатие видео $TAG" \
            --notes "Скачайте VideoSzhatie.apk на телефон и установите (Android 10+)." \
            --latest
